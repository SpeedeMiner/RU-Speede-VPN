# Сгенерировано scripts/render_profiles.py из шаблона Happ.
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning
ipv6: true
geodata-mode: true
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
hosts:
  lkfl2.nalog.ru: 213.24.64.175
  lknpd.nalog.ru: 213.24.64.181
dns:
  enable: true
  enhanced-mode: redir-host
  use-hosts: true
  ipv6: true
  default-nameserver:
  - 77.88.8.8
  proxy-server-nameserver:
  - https://common.dot.dns.yandex.net/dns-query#DIRECT
  nameserver:
  - https://dns.google/dns-query#PROXY
  direct-nameserver:
  - https://common.dot.dns.yandex.net/dns-query#DIRECT
proxies:
- name: LOCAL-SOCKS
  type: socks5
  server: 127.0.0.1
  port: 1081
  udp: true
proxy-groups:
- name: PROXY
  type: select
  proxies:
  - LOCAL-SOCKS
rule-providers:
